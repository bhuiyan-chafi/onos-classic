<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONOS &bull; Sign In</title>
    <link rel="shortcut icon" href="data/img/onos-logo.png">
    <style type="text/css">
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-base: #0b1120;
            --bg-card: rgba(30, 41, 59, 0.92);
            --border-card: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(255, 255, 255, 0.14);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --input-bg: #090e1c;
            --input-border: #334155;
            --input-focus: #ce5650;
            --input-focus-ring: rgba(206, 86, 80, 0.22);
            --btn-bg: #ce5650;
            --btn-hover: #b9443e;
            --btn-active: #a83832;
            --btn-shadow: rgba(206, 86, 80, 0.28);
            --radius-md: 8px;
            --radius-lg: 14px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
            background-color: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Ambient subtle radial glow */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 35% 50%, rgba(30, 41, 59, 0.45) 0%, rgba(11, 17, 32, 0.95) 75%);
            z-index: 0;
            pointer-events: none;
        }

        /* Big ONOS Logo Overlay on the Left (seamless, no dividers) */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data/img/onos-project-logo.png');
            background-repeat: no-repeat;
            background-position: 8% center;
            background-size: min(650px, 48vw);
            opacity: 0.25;
            pointer-events: none;
            z-index: 1;
        }

        /* Page container with authentication card on the right */
        .page-container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 2.5rem 8vw 2.5rem 2rem;
        }

        /* Authentication Card */
        .login-card {
            width: 100%;
            max-width: 360px;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-top: 1px solid var(--border-highlight);
            border-radius: var(--radius-lg);
            padding: 2.25rem 2rem;
            box-shadow: 0 20px 45px -12px rgba(0, 0, 0, 0.65), 0 2px 6px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .card-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-meta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 0.45rem;
        }

        .brand-icon {
            width: 34px;
            height: 32px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        .brand-title {
            font-size: 1.55rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            line-height: 1;
        }

        .brand-badge {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #f87171;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.25);
            padding: 2px 7px;
            border-radius: 4px;
        }

        .brand-subtitle {
            font-size: 0.825rem;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }

        .form-label {
            font-size: 0.825rem;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.01em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            width: 17px;
            height: 17px;
            color: var(--text-muted);
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .input-wrapper:focus-within .input-icon {
            color: var(--input-focus);
        }

        .form-input {
            width: 100%;
            height: 44px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-md);
            padding: 0 14px 0 42px;
            font-size: 0.925rem;
            color: var(--text-primary);
            font-family: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .form-input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px var(--input-focus-ring);
            background: #111a2e;
        }

        .submit-btn {
            margin-top: 0.5rem;
            width: 100%;
            height: 44px;
            background-color: var(--btn-bg);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            letter-spacing: 0.01em;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--btn-shadow);
            transition: background-color 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            background-color: var(--btn-hover);
            box-shadow: 0 6px 18px rgba(206, 86, 80, 0.42);
            transform: translateY(-1px);
        }

        .submit-btn:active {
            background-color: var(--btn-active);
            transform: translateY(0);
            box-shadow: 0 2px 6px var(--btn-shadow);
        }

        .submit-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--input-focus-ring), 0 4px 12px var(--btn-shadow);
        }

        /* Error notification styling for error.html */
        #error {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.75rem 1rem;
            margin-bottom: 1.25rem;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: var(--radius-md);
            color: #fca5a5;
            font-size: 0.85rem;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }

        .error-icon {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            color: #ef4444;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile / Small Screens */
        @media (max-width: 800px) {
            .bg-overlay {
                background-position: center 12%;
                background-size: min(380px, 75vw);
                opacity: 0.15;
            }

            .page-container {
                justify-content: center;
                padding: 2rem 1.25rem;
            }
        }
    </style>
</head>
<body>
    <!-- Big ONOS Project Logo Overlay on the Left -->
    <div class="bg-overlay" aria-hidden="true"></div>

    <main class="page-container">
        <div class="login-card">
            <header class="card-header">
                <div class="brand-meta">
                    <img src="data/img/onos-logo.png" alt="ONOS" class="brand-icon" />
                    <h1 class="brand-title">ONOS</h1>
                    <span class="brand-badge">CLASSIC</span>
                </div>
                <p class="brand-subtitle">Open Network Operating System</p>
            </header>

            <form method="post" action="j_security_check" class="login-form">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input id="username" name="j_username" type="text" class="form-input" placeholder="Username" autocomplete="username" autofocus required />
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input id="password" name="j_password" type="password" class="form-input" placeholder="Password" autocomplete="current-password" required />
                    </div>
                </div>

                <input id="submit" type="submit" value="Sign In" class="submit-btn" />
            </form>
        </div>
    </main>
</body>
</html>
